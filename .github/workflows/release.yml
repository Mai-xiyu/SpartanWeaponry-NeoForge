name: Release

on:
  push:
    tags:
      - '*-*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Existing release tag to publish, for example 1.21.1-1.2.0'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag_name || github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag_name || github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build with Gradle
        run: ./gradlew build --no-daemon -x test

      - name: Validate publishing secrets
        shell: bash
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          set -euo pipefail

          missing=0

          if [[ -z "${MODRINTH_TOKEN}" ]]; then
            echo "::error::Missing repository secret MODRINTH_TOKEN. Modrinth publication cannot run."
            missing=1
          fi

          if [[ -z "${CURSEFORGE_TOKEN}" ]]; then
            echo "::error::Missing repository secret CURSEFORGE_TOKEN. CurseForge publication cannot run."
            missing=1
          fi

          exit "${missing}"

      - name: Generate release changelog
        shell: bash
        run: |
          set -euo pipefail

          current_tag="${RELEASE_TAG}"
          current_commit="$(git rev-list -n 1 "${current_tag}")"
          previous_tag="$(git tag --points-at "${current_commit}" --sort=-creatordate | grep -v -F -x "${current_tag}" | head -n 1 || true)"

          if [[ -z "${previous_tag}" ]]; then
            previous_tag="$(git describe --tags --abbrev=0 "${current_commit}^" 2>/dev/null || true)"
          fi

          {
            echo "## Changes"
            echo

            if [[ -n "${previous_tag}" ]]; then
              echo "Commits from ${previous_tag} to ${current_tag}:"
              echo
              commits="$(git log --pretty=format:'- %s (%h)' "${previous_tag}..${current_tag}" || true)"
            else
              echo "Commits included in ${current_tag}:"
              echo
              commits="$(git log --pretty=format:'- %s (%h)' "${current_tag}" || true)"
            fi

            if [[ -n "${commits}" ]]; then
              echo "${commits}"
            else
              echo "- No commits found for this tag range."
            fi
          } > RELEASE_CHANGELOG.md

      - name: Publish release
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: w8V2GMiK
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: 1450963
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ env.RELEASE_TAG }}
          github-draft: false
          github-prerelease: false

          files: build/libs/!(*-sources|*-plain).jar
          name: ${{ env.RELEASE_TAG }}
          version: ${{ env.RELEASE_TAG }}
          version-type: release
          changelog-file: RELEASE_CHANGELOG.md
          
          loaders: neoforge
          game-versions: 1.21.1
